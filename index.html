<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="숙소 이용 안내를 한눈에 확인하세요" />
    <title>스테이연 사용설명서</title>

    <!-- Open Graph (OG) Meta Tags (KakaoTalk, Facebook, etc.) -->
    <meta property="og:title" content="스테이연 사용설명서" />
    <meta property="og:description" content="숙소 이용 안내를 한눈에 확인하세요" />
    <meta property="og:type" content="website" />
    <!-- 
      배포 후 실 도메인 주소가 확정되면 절대경로로 수정해주세요.
      예: content="https://your-domain.com/og-image.png"
    -->
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="스테이연 사용설명서" />
    <meta name="twitter:description" content="숙소 이용 안내를 한눈에 확인하세요" />
    <!-- 
      배포 후 실 도메인 주소가 확정되면 절대경로로 수정해주세요.
      예: content="https://your-domain.com/og-image.png"
    -->
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
